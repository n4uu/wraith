name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: go build ./...

  bpf-recompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recompile the BPF object and diff against the checked-in one
        run: |
          set -eu
          clang -target bpf -D__TARGET_ARCH_x86 -O2 -g -Wall -Werror \
            -Ibpf/include -Ibpf -c bpf/wraith.bpf.c -o /tmp/wraith.bpf.o
          echo "compiled OK ($(stat -c%s /tmp/wraith.bpf.o) bytes) — informational only, byte-for-byte diffs against the checked-in object are expected across clang versions"
